# ============================================================
# Render Blueprint Specification for STEWARD
# Autonomous Developer Agent - Cloud Backend & Worker
# ============================================================
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: steward-db
    databaseName: steward
    user: steward_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # 1. Steward Headless Cloud Daemon (Web Service API & WebSocket Server)
  - type: web
    name: steward-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_daemon.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STEWARD_HOST
        value: 0.0.0.0
      - key: STEWARD_PERMISSION_MODE
        value: autonomous
      - key: RENDER_SYNC_ENABLED
        value: "true"
      - key: RENDER_POSTGRES_DSN
        fromDatabase:
          name: steward-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: PLANNER_MODEL
        value: deepseek-ai/deepseek-r1
      - key: ACTOR_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: COMPACTOR_MODEL
        value: meta/llama-3.1-8b-instruct

  # 2. Steward Background Replication & Outbox Worker
  - type: worker
    name: steward-outbox-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m steward.storage.sync_outbox
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER_SYNC_ENABLED
        value: "true"
      - key: RENDER_POSTGRES_DSN
        fromDatabase:
          name: steward-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
