[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-agent"
version = "2.0.0"
description = "Next-Generation Autonomous Developer Agent (Steward / Code-Daemon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Steward Team & Community" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators"
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "pywin32>=306",
    "mss>=9.0.0",
    "PyQt6>=6.6.0",
    "qtpy>=2.4.0",
    "psycopg2-binary>=2.9.9",
    "pg8000>=1.30.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
agent-daemon = "run_daemon:main"
agent-app = "run_app:main"
custom-agent = "STEWARD.client.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
