# ============================================================
# Render Blueprint Specification for STEWARD
# Autonomous Developer Agent - Cloud Backend & Database
# 100% Free-Tier Architecture (Outbox worker runs inside Web Service)
# ============================================================
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: steward-db
    databaseName: steward
    user: steward_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # Steward Headless Cloud Daemon (Web Service API, WebSockets & Outbox Worker)
  - type: web
    name: steward-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_daemon.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STEWARD_HOST
        value: 0.0.0.0
      - key: STEWARD_PERMISSION_MODE
        value: autonomous
      - key: RENDER_SYNC_ENABLED
        value: "true"
      - key: RENDER_POSTGRES_DSN
        fromDatabase:
          name: steward-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: PLANNER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: ACTOR_MODEL
        value: deepseek-ai/deepseek-v4.1-flash
      - key: HEAVY_MODEL
        value: moonshotai/kimi-k3
      - key: AGENT_MODEL
        value: z-ai/glm-5.3
      - key: COMPACTOR_MODEL
        value: nv-mistralai/mistral-nemo-12b-instruct
